<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mortgage calculator
    </title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <div class="calculator">
        <h2>Mortgage calculator BY Aura craft labs limmited</h2>

        <label>loan amount ($):</label>
        <input type="number" id="amount" placeholder="300000">

        <label>Annual Interset Rate (%):</label>
        <input type="number" step="0.01" id="interset" placeholder="6,5">

        <label> loan Term (Years):</label>
        <input type="number" id="years" placeholder="30">

        <button id="calcBtn">calculate   Payment</button>
        <h3> monthly Payment : <span id="result">$0.00</span></h3>
        </div>









    <script src="./index.js"></script>
</body>
</html>
